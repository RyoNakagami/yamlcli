name: Tag and Release on Merge

on:
  pull_request:
    branches:
      - main
    types:
      - closed  # PR closure event

permissions:
  contents: write

jobs:
  post_merge:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # -------------------------------
      # Step 1: Extract version from pyproject.toml
      # -------------------------------
      - name: Extract version from pyproject.toml
        id: version
        run: |
          VERSION=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # -------------------------------
      # Step 2: Guard against duplicate releases
      # -------------------------------
      - name: Abort if tag already exists
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.version.outputs.tag }} already exists. Aborting."
            exit 1
          fi

      # -------------------------------
      # Step 3: Verify CHANGELOG and extract release notes
      # -------------------------------
      - name: Verify CHANGELOG entry and extract release notes
        run: |
          python3 - <<'EOF'
          import re, sys
          version = "${{ steps.version.outputs.version }}"
          changelog = open("CHANGELOG.md").read()
          pattern = rf"## \[{re.escape(version)}\].*?(?=\n## |\Z)"
          match = re.search(pattern, changelog, re.DOTALL)
          if not match:
              print(
                  f"ERROR: No CHANGELOG entry found for version {version}. "
                  f"Add a '## [{version}]' section to CHANGELOG.md before releasing.",
                  file=sys.stderr,
              )
              sys.exit(1)
          notes = match.group(0).strip()
          open("release_notes.md", "w").write(notes)
          print(f"Found release notes for v{version}")
          EOF

      # -------------------------------
      # Step 4: Create Git tag and GitHub Release
      # -------------------------------
      - name: Create and push tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" \
            -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:  ${{ steps.version.outputs.tag }}
          name:      ${{ steps.version.outputs.tag }}
          body_path: release_notes.md
